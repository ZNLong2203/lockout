[project]
name = "lockout"
version = "0.1.0"
description = "Macro scouting for League of Legends from player trajectories: opponent fingerprints, evidence-backed tells, 2D replay."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "orjson>=3.10",
  "zstandard>=0.23",
  "numpy>=2.0",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.12",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
lockout = "lockout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockout"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
# Long prose lines in docstrings/comments are fine; the formatter still wraps code at 100.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
